<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      color: white;
    }
    body {
      background-image: url('https://ocenslinkupl.my.id/uploads/140e61cd645386e78f4b9c73b087d48d.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      margin: 0 ;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;  
    }   

    .box {
      height: 250px;
      width: 250px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(2px);
      border: solid 1px;
      border-color: black;
      border-radius: 30px;
      padding: 20px;
      margin: 20px;
    }
    input {
      background: none;
      border-block: white;
      color: white;
      width: 120px;
    }
    h1{
      text-align: center;
    }
    button{
      color: black;
    }
  </style>
</head>
<body>
  <div class="box">
    <H1>ENTER CODE!</H1>
    <input type="text" id="code">
    <button onclick="konfir()">konfirmasi</button>
  </div>
  <script>
    function konfir() {
      let code = Document.getElementById("code").value;
      let hasil = Document.getElementById("hasil");

      if(code == "") {
        hasil.innerHTML = "CODE TIDAK BOLEH KOSONG";
        hasil.style.color = "red";
      }
        
    }
  </script>
</body>
</html>
